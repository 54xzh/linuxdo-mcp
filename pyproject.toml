[project]
name = "linuxdo-mcp"
version = "0.3.0"
description = "MCP server for searching and reading linux.do (Discourse), stdio + OAuth-protected streamable-http"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "curl_cffi>=0.7",
    "pycookiecheat>=0.8",
    "httpx>=0.28.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
linuxdo-mcp = "linuxdo_mcp.server:main"
linuxdo-mcp-oauth-password = "linuxdo_mcp.oauth.cli:generate_password_hash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linuxdo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
